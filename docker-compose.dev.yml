# Development only: serves the local web build ("flutter build web") with the nginx configuration
# of production, so that its headers (Content-Security-Policy...) are tried before a release.

services:
  floraccess-app:
    image: nginx:stable-alpine
    ports:
      - ${APP_PORT:-}:8080
    volumes:
      - ./build/web:/usr/share/nginx/html/:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.env:/usr/share/nginx/html/assets/.env:ro
    command: ["nginx", "-g", "daemon off;"]
